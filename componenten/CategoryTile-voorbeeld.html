<!doctype html>
<html data-theme="light" lang="nl">
<head>
<meta charset="utf-8">
<title>CategoryTile — DectDirect</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../fonts/barlow.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
</head>
<body>
<div class="dd-stage" style="gap:24px">
 <div class="dd-col"><p class="dd-note">Tegel op een categoriepagina</p>
  <div style="display:flex;gap:16px">
   <a class="dd-cat-tile" href="#"><div class="dd-cat-tile__img"><img src="../assets/Categorie-iconen/cat-headsets.svg" alt=""></div><p class="dd-cat-tile__label">Draadloze headsets</p></a>
   <a class="dd-cat-tile" href="#"><div class="dd-cat-tile__img"><img src="../assets/Categorie-iconen/cat-networking.svg" alt=""></div><p class="dd-cat-tile__label">Switches</p></a>
  </div></div>
 <div class="dd-col" style="width:26rem"><p class="dd-note">Categorie-link op home (onder lg)</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
   <a class="dd-cat-link" href="#"><img src="../assets/Categorie-iconen/cat-telefonie.svg" alt="">Telefonie</a>
   <a class="dd-cat-link" href="#"><img src="../assets/Categorie-iconen/cat-headsets.svg" alt="">Headsets</a>
   <a class="dd-cat-link" href="#"><img src="../assets/Categorie-iconen/cat-networking.svg" alt="">Networking</a>
   <a class="dd-cat-link is-brand" href="#"><img src="../assets/Categorie-iconen/cat-xelion.svg" alt="">Cloud telefonie</a>
  </div></div>
</div>
</body>
</html>
