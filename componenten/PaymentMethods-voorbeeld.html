<!doctype html>
<html data-theme="light" lang="nl">
<head>
<meta charset="utf-8">
<title>PaymentMethods — DectDirect</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../fonts/barlow.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
</head>
<body>
<div class="dd-stage" style="gap:32px">
 <div class="dd-col" style="width:100%"><p class="dd-note">Onder de bestelknop</p>
  <div class="dd-pay-logos"><span>Betalen met</span><ul aria-label="Betaalmethodes">
   <li><img src="../assets/Betaalmethoden/ideal.svg" alt="iDEAL | Wero" style="height:1.75rem"></li>
   <li><img src="../assets/Betaalmethoden/bancontact.svg" alt="Bancontact" style="height:1rem"></li>
   <li><img src="../assets/Betaalmethoden/creditcard.svg" alt="Creditcard" style="height:1.5rem"></li>
   <li><img src="../assets/Betaalmethoden/applepay.svg" alt="Apple Pay" style="height:1.25rem"></li>
   <li><img src="../assets/Betaalmethoden/paypal.svg" alt="PayPal" style="height:1.5rem"></li>
   <li><img src="../assets/Betaalmethoden/klarna.svg" alt="Klarna" style="height:.875rem"></li>
   <li><img src="../assets/Betaalmethoden/in3.svg" alt="in3" style="height:1.25rem"></li>
   <li><img src="../assets/Betaalmethoden/banktransfer.svg" alt="Overboeking" style="height:.875rem"></li>
  </ul></div></div>
 <fieldset class="dd-fieldset"><legend class="dd-legend">Ik bestel als</legend>
  <div class="dd-toggle"><label><input type="radio" name="t"><span><svg class="dd-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"/></svg>Particulier</span></label><label><input type="radio" name="t" checked><span><svg class="dd-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l18 0"/><path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4"/><path d="M5 21l0 -10.15"/><path d="M19 21l0 -10.15"/><path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4"/></svg>Zakelijk</span></label></div></fieldset>
 <fieldset class="dd-fieldset" style="max-width:28rem"><legend class="dd-legend">Betaalwijze</legend>
  <label class="dd-radio"><input type="radio" name="p" checked><span>Online betalen <span class="is-muted">(iDEAL | Wero, Bancontact, Creditcard en meer)</span></span></label>
  <label class="dd-radio"><input type="radio" name="p"><span>Koop op rekening <span class="is-muted">(je ontvangt de factuur, te betalen binnen 30 dagen)</span><span class="is-muted" style="display:block">Nog € 2.500,00 beschikbaar op rekening (excl. btw)</span></span></label>
 </fieldset>
</div>
</body>
</html>
