<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Button — DectDirect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="dd-stage">
 <div class="dd-col"><p class="dd-note">Koopactie (winkelmand, afrekenen)</p><a class="dd-btn dd-btn-buy" href="#">Afrekenen</a></div>
 <div class="dd-col" style="width:22rem"><p class="dd-note">Groot, productpagina</p><button class="dd-btn dd-btn-buy-lg"><svg class="dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17h-11v-14h-2"/><path d="M6 5l14 1l-1 7h-13"/></svg>Toevoegen aan winkelwagen</button></div>
 <div class="dd-col"><p class="dd-note">Uitgeschakeld (Rails)</p><span class="dd-btn dd-btn-disabled">Afrekenen</span></div>
 <div class="dd-col"><p class="dd-note">Stil (Rails)</p><button class="dd-btn dd-btn-quiet">Toepassen</button></div>
 <div class="dd-col" style="width:22rem"><p class="dd-note">Omlijnd (verlanglijst)</p><a class="dd-btn dd-btn-outline" href="#"><svg class="dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>Aan verlanglijst toevoegen</a></div>
</div>
<div class="dd-stage" style="background:var(--color-violet-900);margin:0 16px 16px;border-radius:var(--radius-xl)">
 <a class="dd-btn dd-btn-pill" href="#">Draadloze headsets</a>
 <a class="dd-btn dd-btn-pill-ghost" href="#">Hulp bij kiezen <svg class="dd-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></svg></a>
 <a class="dd-btn dd-btn-banner" href="#">Bekijk het aanbod</a>
</div>
</body>
</html>
