<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>QuantityStepper — DectDirect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="dd-stage"><div style="width:30rem">
 <div class="dd-buy-row">
  <div class="dd-stepper" role="group" aria-label="Aantal"><button type="button" aria-label="Eén minder">&minus;</button><output>3</output><button type="button" aria-label="Eén meer">+</button></div>
  <button class="dd-btn dd-btn-buy-lg"><svg class="dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17h-11v-14h-2"/><path d="M6 5l14 1l-1 7h-13"/></svg>Toevoegen aan winkelwagen</button>
 </div>
 <p class="dd-buy-sum">3 stuks: 2 × 159,95 + 1 × 189,95 = <strong>€ 509,85</strong> <span>(421,36 excl. btw)</span></p>
</div>
<div style="width:30rem">
 <div class="dd-buy-row">
  <div class="dd-stepper" role="group" aria-label="Aantal"><button type="button" disabled aria-label="Eén minder">&minus;</button><output>1</output><button type="button" aria-label="Eén meer">+</button></div>
  <button class="dd-btn dd-btn-buy-lg"><svg class="dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17h-11v-14h-2"/><path d="M6 5l14 1l-1 7h-13"/></svg>Toevoegen aan winkelwagen</button>
 </div>
 <p class="dd-buy-sum">1 stuk: 1 × 159,95 = <strong>€ 159,95</strong> <span>(132,19 excl. btw)</span></p>
</div></div>
</body>
</html>
